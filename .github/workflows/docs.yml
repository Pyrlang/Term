# Build the documentation (plan step DOCS-01): Sphinx with warnings as
# errors, on every push and pull request. The HTML is kept as an artifact,
# and a push to the default branch publishes it (DOCS-04,
# docs-src/DEPLOY.md).

name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # No Rust toolchain is needed: the reference is built from the
      # pure-Python modules (docs-src/source/conf.py).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs
      - run: python -m sphinx -W --keep-going -b html docs-src/source docs-src/build/html
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs-src/build/html

  deploy:
    name: Publish to pyrlang.github.io/term/
    needs: build
    # Only the default branch of the main repository publishes: never a
    # pull request, never a fork.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'Pyrlang/Term'
    runs-on: ubuntu-latest
    # The protected environment that holds the deploy key (docs-src/DEPLOY.md).
    environment: docs
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs-src/build/html
      - name: Publish
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
          DOCS_DEPLOY_NAME: github-actions[bot]
          DOCS_DEPLOY_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          echo "$DOCS_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          tools/deploy-docs.sh
