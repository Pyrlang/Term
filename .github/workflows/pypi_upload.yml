# Upload the wheels and sdist of the latest Build run (build.yml) to
# TestPyPI or PyPI; run by hand.

name: Upload to Pypi

on:
  workflow_dispatch:
    inputs:
      pypi_repo:
        description: 'Repo to upload to (testpypi or pypi)'
        default: 'testpypi'
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: artifacts
      # build.yml uploads one artifact per platform plus the sdist.
      - name: Collect the distributions
        run: |
          mkdir dist
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -l dist
      - name: Publish package to Test Pypi
        if: ${{ github.event.inputs.pypi_repo == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TEST_TOKEN }}
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
      - name: Publish package to Pypi
        if: ${{ github.event.inputs.pypi_repo == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TEST_TOKEN }}
          packages-dir: dist/
