# Format, lint, type check and test both codecs (plan step TERM-19): the
# checks AGENTS.md requires before every commit, on every supported Python
# and OS, and real OTP releases judging what the codecs encode.

name: Testing

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: Format, lint, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # rustup reads the channel and components from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install black isort mypy pytest
          python -m pip install -e . --config-settings editable_mode=compat
      - run: black --check .
      - run: isort --check .
      - run: mypy term
      - run: mypy --strict --follow-imports=silent test
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e . --config-settings editable_mode=compat
      # The extension is optional at install time; here it must be built, or
      # the native half of every test would be skipped.
      - name: The native codec is built
        run: python -c "import term.native_codec_impl"
      - run: cargo test
      - run: python -m pytest test -m "not erlang" -rs

  erlang:
    name: OTP ${{ matrix.otp }} judges the codecs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The supported peers (decision 1 in the upgrade plan).
        otp: ["25", "26", "27", "28", "29"]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Install
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e . --config-settings editable_mode=compat
          python -c "import term.native_codec_impl"
      # erl from setup-beam is on PATH (test/otp.py).
      - run: python -m pytest test -m erlang -rs
