# Wheels and sdist (plan step TERM-19). The native codec uses PyO3's abi3
# (Python >= 3.11), so one wheel per platform serves every CPython from 3.11
# on; it is built once with CPython 3.11 and imported on the newest one too.

name: Build

on:
  push:
    tags: ["*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build_wheels:
    name: abi3 wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.1.4
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_SKIP: "*-win32 *_i686"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          # The manylinux and musllinux images have no Rust.
          CIBW_BEFORE_ALL_LINUX: "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_MACOS: "rustup target add x86_64-apple-darwin aarch64-apple-darwin"
          CIBW_TEST_REQUIRES: pytest
          # A clean interpreter imports the native module and passes the tests.
          CIBW_TEST_COMMAND: >-
            python -c "import term.native_codec_impl" &&
            python -m pytest {project}/test -m "not erlang" -q -p no:cacheprovider
          CIBW_BUILD_VERBOSITY: 1
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  wheel_on_newest_python:
    name: The abi3 wheel works on Python ${{ matrix.python }}
    needs: build_wheels
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheels
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-index --find-links wheels pyrlang-term
      - name: Import the native codec in isolated mode
        run: >-
          python -I -c "import term.codec as c;
          assert c.co_impl.__name__ == 'term.native_codec_impl', c.co_impl"

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
